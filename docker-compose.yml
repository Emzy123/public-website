# Local MongoDB and PostgreSQL for development. Not used in production.
# Usage: docker compose up -d
# Then set in .env.local:
#   MONGODB_URI=mongodb://localhost:27017
#   MONGODB_DB=sinet
#   DATABASE_URL=postgresql://postgres@localhost:5432/sinet_dev

services:
  mongodb:
    image: mongo:7
    container_name: sinet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: sinet-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sinet_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sinet_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  postgres_data:

