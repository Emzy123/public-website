# Local MongoDB for development. Not used in production (Atlas).
# Usage: docker compose up -d
# Then set in .env.local:
#   MONGODB_URI=mongodb://localhost:27017
#   MONGODB_DB=sinet

services:
  mongodb:
    image: mongo:7
    container_name: sinet-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
