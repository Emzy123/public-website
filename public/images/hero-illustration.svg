<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-label="Pan-African investment network illustration">
  <defs>
    <linearGradient id="n1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="n2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="650" fill="none"/>

  <!-- Network lines -->
  <g fill="none" stroke="url(#n2)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45">
    <path d="M130 470 C 220 360, 320 380, 390 320 S 560 220, 690 260 S 820 420, 860 390"/>
    <path d="M140 380 C 250 300, 300 310, 390 260 S 540 140, 650 190 S 790 290, 860 250"/>
    <path d="M220 540 C 320 480, 420 520, 510 470 S 690 380, 780 430 S 860 520, 890 500"/>
  </g>

  <!-- Nodes -->
  <g filter="url(#softGlow)">
    <circle cx="170" cy="470" r="12" fill="url(#n1)"/>
    <circle cx="320" cy="380" r="10" fill="url(#n2)"/>
    <circle cx="390" cy="320" r="9" fill="url(#n1)"/>
    <circle cx="510" cy="240" r="11" fill="url(#n2)"/>
    <circle cx="650" cy="190" r="10" fill="url(#n1)"/>
    <circle cx="690" cy="260" r="9" fill="url(#n2)"/>
    <circle cx="790" cy="290" r="10" fill="url(#n1)"/>
    <circle cx="860" cy="250" r="9" fill="url(#n2)"/>
    <circle cx="830" cy="420" r="11" fill="url(#n1)"/>
  </g>

  <!-- Abstract "Africa" silhouette -->
  <path
    d="M445 145
       C420 155, 415 185, 420 210
       C426 240, 408 260, 398 280
       C388 300, 392 330, 410 345
       C428 360, 425 385, 402 398
       C378 411, 368 440, 388 460
       C410 482, 442 490, 465 470
       C486 452, 515 455, 540 470
       C564 485, 595 472, 610 448
       C625 425, 616 402, 600 388
       C582 372, 585 350, 602 336
       C621 320, 625 292, 606 276
       C588 260, 585 240, 600 220
       C617 198, 604 170, 577 165
       C555 161, 546 145, 525 137
       C505 129, 478 135, 445 145 Z"
    fill="#0A1A2F"
    fill-opacity="0.25"
    stroke="#60A5FA"
    stroke-opacity="0.35"
    stroke-width="3"
  />

  <!-- Subtle particles -->
  <g fill="#93C5FD" fill-opacity="0.35">
    <circle cx="95" cy="260" r="5"/>
    <circle cx="235" cy="150" r="4"/>
    <circle cx="290" cy="220" r="3"/>
    <circle cx="760" cy="140" r="4"/>
    <circle cx="710" cy="520" r="5"/>
    <circle cx="480" cy="525" r="4"/>
  </g>
</svg>

