<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="35%" stop-color="#F4D03F" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="200" height="200" rx="44" fill="#0A2342" stroke="url(#goldGradIcon)" stroke-width="4" />

  <!-- Outer Octagon ring -->
  <polygon points="100,20 155,42 180,100 155,158 100,180 45,158 20,100 45,42" fill="none" stroke="url(#goldGradIcon)" stroke-width="6" filter="url(#iconGlow)" />

  <!-- S-curve Network Nodes -->
  <path d="M60 60 C 100 35, 145 60, 100 100 C 55 140, 100 165, 140 140" fill="none" stroke="url(#goldGradIcon)" stroke-width="11" stroke-linecap="round" />

  <!-- Glowing Nodes -->
  <circle cx="60" cy="60" r="10" fill="#FFFFFF" />
  <circle cx="100" cy="100" r="12" fill="#FFF099" />
  <circle cx="140" cy="140" r="10" fill="#FFFFFF" />
</svg>
