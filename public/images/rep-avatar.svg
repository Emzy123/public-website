<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="Representative avatar placeholder">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="rg" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A1A2F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" fill="none"/>

  <circle cx="120" cy="120" r="110" fill="url(#ag)" fill-opacity="0.22" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="120" cy="120" r="110" fill="url(#rg)"/>

  <!-- head -->
  <circle cx="120" cy="104" r="28" fill="#0A1A2F" fill-opacity="0.25" stroke="#93C5FD" stroke-opacity="0.35" stroke-width="2"/>
  <!-- shoulders -->
  <path
    d="M50 210
       C60 165, 85 145, 120 145
       C155 145, 180 165, 190 210 Z"
    fill="#0A1A2F"
    fill-opacity="0.18"
    stroke="#93C5FD"
    stroke-opacity="0.25"
    stroke-width="2"
  />

  <!-- ring accent -->
  <path d="M56 132 C 70 172, 98 196, 132 202" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round"/>
</svg>

