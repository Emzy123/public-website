<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100" fill="none">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D03F" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Network Node / Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Octagon ring -->
    <polygon points="40,5 65,15 75,40 65,65 40,75 15,65 5,40 15,15" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />
    <!-- Inner S-shaped network links -->
    <path d="M25 25 C 40 15, 60 25, 40 40 C 20 55, 40 65, 55 55" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Glowing Nodes -->
    <circle cx="25" cy="25" r="4.5" fill="#F4D03F" />
    <circle cx="40" cy="40" r="5" fill="#FFFFFF" />
    <circle cx="55" cy="55" r="4.5" fill="#F4D03F" />
    <circle cx="40" cy="10" r="3.5" fill="url(#goldGrad)" />
    <circle cx="40" cy="70" r="3.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <!-- Main Brand Name -->
  <text x="100" y="55" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="42" fill="#FFFFFF" letter-spacing="1">
    SINET
  </text>
  <!-- Subtitle Badge -->
  <text x="102" y="76" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="url(#goldGrad)" letter-spacing="4">
    GLOBAL EMPIRES
  </text>
</svg>
